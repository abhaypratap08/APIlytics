worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Structured access log — one JSON object per request.
    # Fields chosen to map cleanly to the APIlytics telemetry event schema.
    log_format api_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"latency_ms":$request_time,'
        '"remote_addr":"$remote_addr",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log api_json;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Some endpoints to exercise route_template normalization.
        location ~ ^/api/orders/([0-9a-fA-F-]+)$ {
            add_header Content-Type application/json;
            return 200 '{"order_id":"$1","status":"ok"}';
        }
        location ~ ^/api/users/([0-9a-fA-F-]+)$ {
            add_header Content-Type application/json;
            return 200 '{"user_id":"$1"}';
        }
    }
}
