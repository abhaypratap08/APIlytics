services:
  postgres:
    image: postgres:16-alpine
    container_name: apilytics-postgres
    restart: unless-stopped
    labels:
      com.apilytics.creator: "Abhay Pratap Singh"
      com.apilytics.role: "Backend and Integration"
      com.apilytics.project: "APIlytics MVP"
    environment:
      POSTGRES_USER: apilytics
      POSTGRES_PASSWORD: apilytics
      POSTGRES_DB: apilytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apilytics -d apilytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: apilytics-nginx
    restart: unless-stopped
    labels:
      com.apilytics.creator: "Abhay Pratap Singh"
      com.apilytics.role: "Test telemetry source"
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx

volumes:
  postgres_data:
